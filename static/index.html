<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background layers -->
    <canvas id="particleCanvas"></canvas>
    <div class="vignette"></div>

    <div class="jarvis-ui">
        <!-- Window Controls (frameless mode) -->
        <div class="window-controls">
            <button class="win-btn win-minimize" id="btnMinimize" title="Minimize">
                <svg viewBox="0 0 12 12" width="12" height="12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
            <button class="win-btn win-close" id="btnClose" title="Close">
                <svg viewBox="0 0 12 12" width="12" height="12"><line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
        </div>

        <!-- HUD Overlay (corner brackets) -->
        <div class="hud-overlay">
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>
            <div class="scan-line"></div>
        </div>

        <!-- ═══ TOP BAR ═══ -->
        <header class="top-bar">
            <div class="top-left">
                <div class="arc-mark"></div>
                <span class="logo-text">J.A.R.V.I.S.</span>
            </div>
            <div class="top-center">
                <span class="sys-label" id="sysLabel">SYSTEMS NOMINAL</span>
            </div>
            <div class="top-right">
                <div class="datetime">
                    <span id="time" class="time-val">--:--:--</span>
                    <span id="date" class="date-val">---</span>
                </div>
                <div class="conn-dot" id="connDot" title="Connection"></div>
            </div>
        </header>

        <!-- ═══ MAIN HUD ═══ -->
        <main class="hud-main">
            <!-- Left Panel: Diagnostics -->
            <aside class="holo-panel panel-left">
                <div class="panel-title">DIAGNOSTICS</div>
                <div class="panel-content">
                    <!-- CPU -->
                    <div class="metric-row">
                        <div class="metric-label">CPU</div>
                        <div class="metric-bar-track">
                            <div class="metric-bar-fill cpu-bar" id="cpuBar"></div>
                        </div>
                        <div class="metric-value" id="cpuVal">0%</div>
                    </div>
                    <!-- RAM -->
                    <div class="metric-row">
                        <div class="metric-label">RAM</div>
                        <div class="metric-bar-track">
                            <div class="metric-bar-fill ram-bar" id="ramBar"></div>
                        </div>
                        <div class="metric-value" id="ramVal">0%</div>
                    </div>
                    <div class="metric-sub" id="ramDetail">0.0 / 0.0 GB</div>
                    <!-- Battery -->
                    <div class="metric-row" id="batteryRow" style="display:none;">
                        <div class="metric-label">BATT</div>
                        <div class="metric-bar-track">
                            <div class="metric-bar-fill batt-bar" id="battBar"></div>
                        </div>
                        <div class="metric-value" id="battVal">--%</div>
                    </div>
                </div>
                <!-- Status indicators -->
                <div class="panel-divider"></div>
                <div class="panel-title">STATUS</div>
                <div class="panel-content status-grid">
                    <div class="status-item">
                        <div class="status-dot online"></div>
                        <span>VOSK STT</span>
                    </div>
                    <div class="status-item">
                        <div class="status-dot online"></div>
                        <span>GEMINI LLM</span>
                    </div>
                    <div class="status-item">
                        <div class="status-dot online"></div>
                        <span>SAPI TTS</span>
                    </div>
                </div>
            </aside>

            <!-- Center: Arc Reactor -->
            <div class="hud-center">
                <!-- Arc Reactor SVG -->
                <svg class="arc-reactor" viewBox="0 0 500 500" id="arcReactor">
                    <!-- Outer ring -->
                    <circle class="reactor-ring r-ring-1" cx="250" cy="250" r="240"/>
                    <circle class="reactor-ring r-ring-2" cx="250" cy="250" r="228"/>
                    <!-- Segment ring -->
                    <circle class="reactor-ring r-ring-3" cx="250" cy="250" r="210"/>
                    <!-- Inner decorative -->
                    <circle class="reactor-ring r-ring-4" cx="250" cy="250" r="185"/>
                    <circle class="reactor-ring r-ring-5" cx="250" cy="250" r="160"/>
                    <!-- Core housing -->
                    <circle class="reactor-ring r-ring-6" cx="250" cy="250" r="100"/>
                    <!-- Tri-brace pattern -->
                    <line class="brace-line" x1="250" y1="110" x2="250" y2="190"/>
                    <line class="brace-line" x1="129" y1="315" x2="195" y2="275"/>
                    <line class="brace-line" x1="371" y1="315" x2="305" y2="275"/>
                    <!-- Tick marks -->
                    <g id="tickMarks"></g>
                    <!-- Data arcs -->
                    <path class="data-arc da-1" d="M 250 50 A 200 200 0 0 1 450 250"/>
                    <path class="data-arc da-2" d="M 450 250 A 200 200 0 0 1 250 450"/>
                    <path class="data-arc da-3" d="M 250 450 A 200 200 0 0 1 50 250"/>
                    <path class="data-arc da-4" d="M 50 250 A 200 200 0 0 1 250 50"/>
                </svg>

                <!-- Waveform canvas -->
                <canvas id="waveCanvas" width="400" height="400"></canvas>

                <!-- Core glow -->
                <div class="core-orb" id="coreOrb">
                    <div class="core-inner"></div>
                </div>

                <!-- Status label -->
                <div class="reactor-status" id="statusText">INITIALIZING</div>
            </div>

            <!-- Right Panel: Communication -->
            <aside class="holo-panel panel-right">
                <div class="panel-title">COMMUNICATION LOG</div>
                <div class="panel-content">
                    <div class="conversation-log" id="conversationLog">
                        <div class="log-msg log-system">
                            All systems operational. Awaiting command input.
                        </div>
                    </div>
                </div>
            </aside>
        </main>

        <!-- ═══ BOTTOM BAR ═══ -->
        <footer class="bottom-bar">
            <div class="input-section">
                <span class="prompt-char">></span>
                <input type="text" id="cmdInput" placeholder="Speak or type a command..."
                       autocomplete="off" spellcheck="false">
                <button id="sendBtn" class="send-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path d="M2 21l21-9L2 3v7l15 2-15 2z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
            <div class="mic-status" id="micIndicator">
                <div class="mic-pulse"></div>
                <span>MIC</span>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
